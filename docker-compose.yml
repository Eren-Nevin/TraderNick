services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - /mnt/viper/tradernick/clickhouse:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: tradernick
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "10003:8123"
      - "10004:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      retries: 30

  ingestion:
    build: ./services/ingestion
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_DB: tradernick
      INGEST_TOKENS: ${INGEST_TOKENS:-BTC,ETH,SOL,ARB,LINK,BNB,POL,LTC,TRX,AAVE,AERO,CAKE,COW,ENA,ETHFI,FET,FIL,HYPE,MORPHO,PENDLE,RENDER,SUSHI,UNI,WLD,VIRTUAL,PAXG}
      WALLETS_PARQUET_PATH: ${WALLETS_PARQUET_PATH:-/app/data/wallets.parquet}
    volumes:
      # local copy of the wallets parquet (path overridable via WALLETS_PARQUET_HOST)
      - ${WALLETS_PARQUET_HOST:-./data}:/app/data:ro
    ports:
      - "10001:8000"
    restart: unless-stopped

  data_server:
    build: ./services/data_server
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_DB: tradernick
    ports:
      - "10002:8000"
    restart: unless-stopped

  # =============================================================
  # Per-provider × {live, backfill} ingestion services (Phase C).
  #
  # All share `./services/ingestion` as the build context — same image,
  # role + provider picked via env. New providers are added by dropping
  # a sibling stanza here; no monolithic file needs to change.
  #
  # During migration the legacy `ingestion` service above stays running
  # with its existing streams + backfills. New services come up idle
  # (force-idle bootstrap, Phase E) and the user enables streams on
  # them one provider at a time.
  # =============================================================

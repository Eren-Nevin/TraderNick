  # =============================================================
  # admin_server — thin Sanic gateway. Holds no state, runs no workers.
  # The dashboard talks ONLY to this service; admin_server fans out /
  # routes to the per-provider services. Provider services remain
  # independently callable by curl / scripts, so the system survives
  # admin_server going offline (chart-data path goes via data_server,
  # which is wholly independent).
  # =============================================================
  admin_server:
    build: ./services/ingestion
    command: ["python", "-m", "sanic", "admin_server:app", "--host=0.0.0.0", "--port=8000", "--single-process"]
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_DB: tradernick
      INGESTION_ROLE: admin_server
      # Routing table — the single source of truth for provider URLs.
      # Adding a new provider = +2 env vars here, +1 in
      # provider_registry.GROUP_TO_PROVIDER, and a sibling service block
      # above. Nothing on the dashboard.
      HYPERLIQUID_LIVE_URL:     ${HYPERLIQUID_LIVE_URL:-http://hyperliquid_live:8000}
      HYPERLIQUID_BACKFILL_URL: ${HYPERLIQUID_BACKFILL_URL:-http://hyperliquid_backfill:8000}
      BINANCE_LIVE_URL:         ${BINANCE_LIVE_URL:-http://binance_live:8000}
      BINANCE_BACKFILL_URL:     ${BINANCE_BACKFILL_URL:-http://binance_backfill:8000}
      TRANSFERS_LIVE_URL:       ${TRANSFERS_LIVE_URL:-http://transfers_live:8000}
      TRANSFERS_BACKFILL_URL:   ${TRANSFERS_BACKFILL_URL:-http://transfers_backfill:8000}
      AAVE_LIVE_URL:            ${AAVE_LIVE_URL:-http://aave_live:8000}
      AAVE_BACKFILL_URL:        ${AAVE_BACKFILL_URL:-http://aave_backfill:8000}
      UNISWAP_LIVE_URL:         ${UNISWAP_LIVE_URL:-http://uniswap_live:8000}
      UNISWAP_BACKFILL_URL:     ${UNISWAP_BACKFILL_URL:-http://uniswap_backfill:8000}
      AERODROME_LIVE_URL:       ${AERODROME_LIVE_URL:-http://aerodrome_live:8000}
      AERODROME_BACKFILL_URL:   ${AERODROME_BACKFILL_URL:-http://aerodrome_backfill:8000}
      LIDO_LIVE_URL:            ${LIDO_LIVE_URL:-http://lido_live:8000}
      LIDO_BACKFILL_URL:        ${LIDO_BACKFILL_URL:-http://lido_backfill:8000}
      MORPHO_LIVE_URL:          ${MORPHO_LIVE_URL:-http://morpho_live:8000}
      MORPHO_BACKFILL_URL:      ${MORPHO_BACKFILL_URL:-http://morpho_backfill:8000}
      SPARK_LIVE_URL:           ${SPARK_LIVE_URL:-http://spark_live:8000}
      SPARK_BACKFILL_URL:       ${SPARK_BACKFILL_URL:-http://spark_backfill:8000}
      GMX_LIVE_URL:             ${GMX_LIVE_URL:-http://gmx_live:8000}
      GMX_BACKFILL_URL:         ${GMX_BACKFILL_URL:-http://gmx_backfill:8000}
      DATA_PROCESS_LIVE_URL:     ${DATA_PROCESS_LIVE_URL:-http://data_process_live:8000}
      DATA_PROCESS_BACKFILL_URL: ${DATA_PROCESS_BACKFILL_URL:-http://data_process_backfill:8000}
      TRADERNICK_ADMIN_URL:      ${TRADERNICK_ADMIN_URL:-http://tradernick_admin:8000}
      # LEGACY_INGESTION_URL intentionally unset — admin_server's
      # fallback chain (PROVIDER_URLS[provider]["live"] or LEGACY...)
      # now resolves to None for any unconfigured provider, surfacing
      # a 502 with the provider name instead of silently routing to a
      # dead container.
    ports:
      # Same host port the monolith used to expose, so existing CLI
      # tooling (`curl localhost:10001/jobs/<id>`) keeps working after
      # the monolith is removed. Dashboard talks to admin_server over
      # the docker network on 8000 directly.
      - "10001:8000"
    restart: unless-stopped

  # Wallets parquet upload endpoint. Accepts uploaded wallets.parquet
  # via /admin/wallets/upload and refreshes the wallet_labels CH
  # dictionary in place. admin_server forwards /admin/wallets/* here.
  tradernick_admin:
    build: ./services/ingestion
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_DB: tradernick
      INGESTION_ROLE: admin
      WALLETS_PARQUET_PATH: ${WALLETS_PARQUET_PATH:-/app/data/wallets.parquet}
    volumes:
      - ${WALLETS_PARQUET_HOST:-./data}:/app/data:ro
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    depends_on:
      - data_server
      - admin_server
    environment:
      INTERNAL_DATA_SERVER_URL: http://data_server:8000
      # admin_server is the single admin entry point. It fans out and
      # routes to the per-provider services internally. Provider services
      # are still independently callable for direct ops work but the
      # dashboard never touches them.
      INTERNAL_INGESTION_URL: http://admin_server:8000
      INGESTION_ADMIN_USER: ${ADMIN_USER:-admin}
      INGESTION_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
    ports:
      - "10000:3000"
    restart: unless-stopped

  # Horatio-parity read API backed by ClickHouse. Read-only — never
  # writes ingestion tables, never queues jobs. Wallet writes and
  # job/admin calls forward to admin_server. Snapshots persist to a
  # bind-mounted directory so they survive container restarts.
  data_provider:
    build: ./services/data_provider
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: tradernick
      CLICKHOUSE_DB: tradernick
      SNAPSHOTS_DIR: /data/snapshots
      # Wallet writes + job calls forward to admin_server, which fans
      # out to the per-provider services.
      ADMIN_SERVER_URL: ${DATA_PROVIDER_ADMIN_URL:-http://admin_server:8000}
    ports:
      - "10005:8000"
    volumes:
      - ./data/snapshots:/data/snapshots
    restart: unless-stopped
